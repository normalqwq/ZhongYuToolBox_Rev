<!DOCTYPE html>
<html lang="zh-cn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>中育ToolBox</title>
    <script>
    /* ============================================================
       官方接口重定向（本项目运行必需，请勿删除）

       背景：原项目把接口写死在作者私有的 zyapi.loshop.com.cn，
             该服务已关闭。本项目改用 Cloudflare Pages Functions
             （functions/api/[[path]].js）做反代，转发到中育官方
             服务器 http://sxz.api.zykj.org。

       作用：拦截所有指向 zyapi.loshop.com.cn 的请求，
             改写为同源 /api/xxx，交给反代处理。
             前端源码里有多处硬编码，改配置优先级不够，只能在这里兜底。
       ============================================================ */
    (function () {
      var DEAD = /^https?:\/\/zyapi\.loshop\.com\.cn/i;

      function rewrite(u) {
        if (typeof u !== 'string') return u;
        return DEAD.test(u) ? u.replace(DEAD, '') : u;
      }

      // 劫持 fetch
      var origFetch = window.fetch;
      window.fetch = function (input, init) {
        try {
          if (typeof input === 'string') {
            input = rewrite(input);
          } else if (input && input.url) {
            var n = rewrite(input.url);
            if (n !== input.url) {
              input = new Request(n, {
                method: input.method,
                headers: input.headers,
                body: input.body,
                credentials: input.credentials,
                redirect: input.redirect
              });
            }
          }
        } catch (e) {}
        return origFetch.apply(this, arguments);
      };

      // 劫持 XHR
      var origOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (method, url) {
        try { url = rewrite(url); } catch (e) {}
        return origOpen.apply(this, arguments);
      };
    })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
