<!DOCTYPE html>
<html lang="zh-cn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>中育ToolBox</title>
    <script>
    (function () {
      var DEAD = /^https?:\/\/zyapi\.loshop\.com\.cn/i;
      function rewrite(u) {
        if (typeof u !== 'string') return u;
        return DEAD.test(u) ? u.replace(DEAD, '') : u;
      }
      var KEY = '__netlog';
      function load() { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } }
      function save(a) { try { localStorage.setItem(KEY, JSON.stringify(a.slice(0, 60))); } catch (e) {} }
      function rec(o) { var a = load(); a.unshift(o); save(a); }

      var origFetch = window.fetch;
      window.fetch = function (input, init) {
        var url = typeof input === 'string' ? input : (input && input.url);
        var method = (init && init.method) || (typeof input !== 'string' && input && input.method) || 'GET';
        var p = origFetch.apply(this, arguments);
        try {
          p.then(function (r) {
            var c; try { c = r.clone(); } catch (e) {}
            if (c) {
              c.text().then(function (txt) {
                rec({ t: new Date().toTimeString().slice(0,8), kind:'fetch', method:method, url:url, status:r.status, body:(txt||'').slice(0,500) });
              }).catch(function () {
                rec({ t: new Date().toTimeString().slice(0,8), kind:'fetch', method:method, url:url, status:r.status, body:'(二进制)' });
              });
            } else {
              rec({ t: new Date().toTimeString().slice(0,8), kind:'fetch', method:method, url:url, status:r.status, body:'' });
            }
          }).catch(function (e) {
            rec({ t: new Date().toTimeString().slice(0,8), kind:'fetch', method:method, url:url, status:-1, body:'失败:'+String(e) });
          });
        } catch (e) {}
        if (typeof input === 'string') {
          var n1 = rewrite(input);
          if (n1 !== input) arguments[0] = n1;
        } else if (input && input.url) {
          var n2 = rewrite(input.url);
          if (n2 !== input.url) {
            arguments[0] = new Request(n2, { method:input.method, headers:input.headers, body:input.body, credentials:input.credentials, redirect:input.redirect });
          }
        }
        return p;
      };

      var origOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (method, url) {
        try { url = rewrite(url); } catch (e) {}
        try {
          var self = this;
          this.addEventListener('loadend', function () {
            try {
              rec({ t:new Date().toTimeString().slice(0,8), kind:'xhr', method:method, url:url, status:self.status, body:(self.responseText||'').slice(0,500) });
            } catch (e) {}
          });
        } catch (e) {}
        return origOpen.apply(this, arguments);
      };

      function scan() {
        try {
          var imgs = document.querySelectorAll('img');
          for (var i = 0; i < imgs.length; i++) {
            var im = imgs[i]; var s = im.getAttribute('src');
            if (!s) continue;
            var bad = im.complete && im.naturalWidth === 0;
            if (!im.__rec) { im.__rec = 1;
              rec({ t:new Date().toTimeString().slice(0,8), kind:'img', url:s, status:bad?'加载失败':(im.complete?'OK':'加载中') }); }
          }
          var fr = document.querySelectorAll('iframe');
          for (var j = 0; j < fr.length; j++) {
            var f = fr[j]; var fs = f.getAttribute('src');
            if (fs && !f.__rec) { f.__rec = 1;
              rec({ t:new Date().toTimeString().slice(0,8), kind:'iframe', url:fs }); }
          }
        } catch (e) {}
      }
      document.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t.tagName === 'IMG') rec({ t:new Date().toTimeString().slice(0,8), kind:'img', url:t.src||t.getAttribute('src'), status:'加载失败(error事件)' });
      }, true);
      document.addEventListener('DOMContentLoaded', function () {
        new MutationObserver(scan).observe(document.body, { childList:true, subtree:true, attributes:true, attributeFilter:['src'] });
        scan(); setInterval(scan, 2000);
      });
    })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
