<!DOCTYPE html>
<html lang="zh-cn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>中育ToolBox</title>
    <script>
    (function () {
      var DEAD = /^https?:\/\/zyapi\.loshop\.com\.cn/i;
      var panel = null, list = null, count = 0;

      function rewrite(u) {
        if (typeof u !== 'string') return u;
        if (DEAD.test(u)) return u.replace(DEAD, '');
        return u;
      }

      function ensure() {
        if (panel) return;
        panel = document.createElement('div');
        panel.style.cssText =
          'position:fixed;left:0;right:0;bottom:0;max-height:45vh;overflow:auto;' +
          'background:rgba(0,0,0,.9);color:#fff;font:12px/1.5 monospace;' +
          'z-index:2147483647;padding:8px;white-space:pre-wrap;word-break:break-all';
        panel.innerHTML = '<div style="color:#4ade80;font-weight:bold;margin-bottom:6px">' +
          '请求监控（绿=走反代 红=直连外部）</div>';
        list = document.createElement('div');
        panel.appendChild(list);
        document.body.appendChild(panel);
      }

      function add(url, method, wasRewritten) {
        count++;
        ensure();
        var isLocal = false;
        try { isLocal = new URL(url, location.href).origin === location.origin; } catch (e) {}
        var color = isLocal ? '#4ade80' : '#f87171';
        var row = document.createElement('div');
        row.style.cssText = 'border-top:1px solid #333;padding:4px 0';
        row.innerHTML =
          '<span style="color:#94a3b8">#' + count + ' ' + (method || '') + '</span> ' +
          '<span style="color:' + color + '">' + (isLocal ? '[同源]' : '[外部]') + '</span> ' +
          (wasRewritten ? '<span style="color:#fbbf24">[已改写]</span> ' : '') + url;
        list.insertBefore(row, list.firstChild);
      }

      var origFetch = window.fetch;
      window.fetch = function (input, init) {
        try {
          if (typeof input === 'string') {
            var n = rewrite(input);
            add(n, (init && init.method) || 'GET', n !== input);
            if (n !== input) input = n;
          } else if (input && input.url) {
            var n2 = rewrite(input.url);
            add(n2, (init && init.method) || input.method || 'GET', n2 !== input.url);
            if (n2 !== input.url) {
              input = new Request(n2, {
                method: input.method,
                headers: input.headers,
                body: input.body,
                credentials: input.credentials,
                redirect: input.redirect
              });
            }
          }
        } catch (e) {}
        return origFetch.apply(this, arguments);
      };

      var origOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (method, url) {
        try {
          var n = rewrite(url);
          add(n, method, n !== url);
          if (n !== url) url = n;
        } catch (e) {}
        return origOpen.apply(this, arguments);
      };

      window.__loggerReady = true;
    })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
