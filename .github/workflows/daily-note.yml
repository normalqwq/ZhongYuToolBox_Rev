name: 每日早报 → 云笔记

# 北京时间每天 06:00 = UTC 22:00（前一天）
# 说明：GitHub Actions 的 cron 用 UTC，且高峰期可能延迟数分钟到数十分钟。
on:
  schedule:
    - cron: '0 22 * * *'
  # 支持手动触发（可开 DRY_RUN 只生成不上传，方便调试）
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只生成内容与 PDF，不上传（1=开启）'
        required: false
        default: '0'

permissions:
  contents: read

jobs:
  daily-note:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装项目依赖
        run: npm ci

      - name: 安装中文字体（供 Playwright 渲染 PDF）
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: 安装 Playwright 与 Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: 生成并上传早报
        env:
          ZY_BASE_URL: ${{ secrets.ZY_BASE_URL }}
          ZY_USERNAME: ${{ secrets.ZY_USERNAME }}
          ZY_PASSWORD: ${{ secrets.ZY_PASSWORD }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_PROMPT: ${{ secrets.AI_PROMPT }}
          NEWS_SOURCES: ${{ secrets.NEWS_SOURCES }}
          NOTE_NAME_PREFIX: ${{ secrets.NOTE_NAME_PREFIX }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node scripts/daily-note.mjs

      - name: 保存产物（调试用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: tmp/
          if-no-files-found: ignore
          retention-days: 7
