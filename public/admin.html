<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>访问名单管理 · 中育ToolBox</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
      'Microsoft YaHei', sans-serif;
    background: linear-gradient(160deg, #eef2ff 0%, #f8fafc 40%, #ecfeff 100%);
    min-height: 100vh;
    color: #1e293b;
    padding: 24px 14px 60px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .card {
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    box-shadow: 0 10px 36px rgba(30, 41, 59, 0.08);
    padding: 26px 22px;
  }
  h1 { font-size: 20px; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #64748b; line-height: 1.7; margin-bottom: 20px; }
  label { display: block; font-size: 13px; color: #475569; margin-bottom: 6px; font-weight: 600; }
  input[type="password"], input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
    background: #fff;
  }
  input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
  button {
    border: none;
    border-radius: 10px;
    padding: 11px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .08s, opacity .15s, background .15s;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: #4f46e5; color: #fff; width: 100%; margin-top: 14px; }
  .btn-primary:hover { background: #4338ca; }
  .btn-add { background: #0ea5e9; color: #fff; white-space: nowrap; }
  .btn-add:hover { background: #0284c7; }
  .btn-del {
    background: #fef2f2; color: #dc2626; padding: 6px 12px; font-size: 13px;
    border: 1px solid #fecaca;
  }
  .btn-del:hover { background: #fee2e2; }
  .btn-batch-del {
    background: #dc2626; color: #fff; padding: 7px 14px; font-size: 13px;
  }
  .btn-batch-del:hover { background: #b91c1c; }
  .btn-page {
    background: #fff; color: #475569; border: 1px solid #cbd5e1;
    padding: 6px 12px; font-size: 13px; border-radius: 8px;
  }
  .btn-page:hover:not(:disabled) { background: #f1f5f9; }
  .btn-page:disabled { opacity: .4; }
  .btn-ghost {
    background: transparent; color: #64748b; border: 1px solid #cbd5e1;
    padding: 7px 14px; font-size: 13px;
  }
  .btn-ghost:hover { background: #f1f5f9; }
  .msg { margin-top: 12px; font-size: 13px; min-height: 20px; text-align: center; }
  .msg.err { color: #dc2626; }
  .msg.ok { color: #059669; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .topbar h1 { margin: 0; }
  .add-row { display: flex; gap: 8px; margin: 16px 0 8px; }
  .add-row input { flex: 1; }
  .toolbar {
    display: flex; gap: 8px; align-items: center; margin: 14px 0 10px;
  }
  .toolbar input { flex: 1; padding: 9px 12px; font-size: 14px; }
  .count { font-size: 13px; color: #64748b; margin: 14px 0 8px; }
  .batch-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: #fff7ed; border: 1px solid #fed7aa; border-radius: 10px;
    padding: 8px 12px; margin-bottom: 10px; font-size: 13px; color: #9a3412;
  }
  .batch-bar.hidden { display: none; }
  ul.list { list-style: none; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; }
  .list-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; background: #f1f5f9;
    border: 1px solid #e2e8f0; border-radius: 12px 12px 0 0;
    font-size: 13px; color: #475569; font-weight: 600;
  }
  .list-header input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
  .list-header label { margin: 0; font-weight: 600; cursor: pointer; }
  ul.list li {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; font-size: 15px; background: #fff;
    border-bottom: 1px solid #f1f5f9;
    word-break: break-all;
    gap: 10px;
  }
  ul.list li:last-child { border-bottom: none; }
  ul.list li input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; }
  ul.list li .uname { flex: 1; }
  .pagination {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 12px; gap: 8px; flex-wrap: wrap;
  }
  .page-info { font-size: 13px; color: #64748b; }
  .page-ctrl { display: flex; align-items: center; gap: 6px; }
  .page-size { display: flex; align-items: center; gap: 4px; font-size: 13px; color: #64748b; }
  .page-size select {
    padding: 5px 8px; border: 1px solid #cbd5e1; border-radius: 8px;
    font-size: 13px; background: #fff; color: #475569; cursor: pointer;
  }
  .empty {
    text-align: center; color: #94a3b8; font-size: 14px;
    padding: 26px 10px; border: 1px dashed #cbd5e1; border-radius: 12px;
    background: #f8fafc;
  }
  .tip {
    margin-top: 18px; font-size: 12px; color: #94a3b8; line-height: 1.7;
    background: #f8fafc; border-radius: 10px; padding: 10px 12px;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">

    <!-- 登录卡片 -->
    <div id="loginBox">
      <h1>🔒 访问名单管理</h1>
      <div class="sub">
        这里管理可以登录中育ToolBox 的同学名单。<br />
        请输入管理员密码（在 Cloudflare 环境变量 <code>ADMIN_PASSWORD</code> 中设置）。
      </div>
      <label for="pw">管理员密码</label>
      <input id="pw" type="password" placeholder="输入管理员密码" autocomplete="current-password" />
      <button class="btn-primary" id="loginBtn">进入后台</button>
      <div class="msg" id="loginMsg"></div>
    </div>

    <!-- 管理卡片 -->
    <div id="panelBox" class="hidden">
      <div class="topbar">
        <h1>🔒 访问名单管理</h1>
        <button class="btn-ghost" id="logoutBtn">退出</button>
      </div>
      <div class="sub">只有名单里的<b>学校平台用户名</b>能登录本站。添加后立即生效；把某人删掉，他的访问也会立即失效。</div>

      <label for="newName">添加用户名</label>
      <div class="add-row">
        <input id="newName" type="text" placeholder="输入要添加的学校平台用户名" maxlength="64" />
        <button class="btn-add" id="addBtn">添加</button>
      </div>

      <div class="toolbar">
        <input id="searchInput" type="text" placeholder="🔍 搜索用户名…" />
      </div>

      <div class="count" id="countLine"></div>

      <div class="batch-bar hidden" id="batchBar">
        <span id="batchInfo">已选 0 个</span>
        <div>
          <button class="btn-ghost" id="clearSelBtn" style="margin-right:8px">取消选择</button>
          <button class="btn-batch-del" id="batchDelBtn">删除选中</button>
        </div>
      </div>

      <div id="listBox"></div>

      <div class="pagination">
        <div class="page-size">
          每页
          <select id="pageSizeSelect">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
          条
        </div>
        <div class="page-info" id="pageInfo"></div>
        <div class="page-ctrl">
          <button class="btn-page" id="prevBtn">上一页</button>
          <button class="btn-page" id="nextBtn">下一页</button>
        </div>
      </div>

      <div class="msg" id="panelMsg"></div>

      <div class="tip">
        提示：用户名就是同学在 App / 网站登录学校平台时用的账号（一般是学号），不是昵称。<br />
        名单保存在 Cloudflare KV，修改无需重新部署网站。
      </div>
    </div>

  </div>
</div>

<script>
const $ = (id) => document.getElementById(id)
const loginBox = $('loginBox'), panelBox = $('panelBox')
const loginMsg = $('loginMsg'), panelMsg = $('panelMsg')

// ---------- 前端状态 ----------
const state = {
  allUsers: [],
  search: '',
  page: 1,
  pageSize: 20,
  selected: new Set()
}

async function api(path, options = {}) {
  const resp = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    ...options
  })
  let data = {}
  try { data = await resp.json() } catch {}
  return { ok: resp.ok && data.ok !== false, status: resp.status, data }
}

function flash(el, text, type) {
  el.textContent = text
  el.className = 'msg ' + (type || '')
  if (text) setTimeout(() => { el.textContent = ''; el.className = 'msg' }, 3000)
}

// ---------- 登录 ----------
async function doLogin() {
  const password = $('pw').value
  if (!password) return flash(loginMsg, '请输入密码', 'err')
  $('loginBtn').disabled = true
  const r = await api('/admin-api/login', { method: 'POST', body: JSON.stringify({ password }) })
  $('loginBtn').disabled = false
  if (r.ok) {
    loginBox.classList.add('hidden')
    panelBox.classList.remove('hidden')
    loadUsers()
  } else {
    flash(loginMsg, r.data.message || '登录失败', 'err')
  }
}
$('loginBtn').addEventListener('click', doLogin)
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin() })

// ---------- 名单（带搜索 / 翻页 / 多选） ----------
function getFiltered() {
  const q = state.search.trim().toLowerCase()
  if (!q) return state.allUsers
  return state.allUsers.filter((u) => u.toLowerCase().includes(q))
}

function getTotalPages() {
  return Math.max(1, Math.ceil(getFiltered().length / state.pageSize))
}

function getPaged() {
  const filtered = getFiltered()
  const total = getTotalPages()
  if (state.page > total) state.page = total
  if (state.page < 1) state.page = 1
  const start = (state.page - 1) * state.pageSize
  return filtered.slice(start, start + state.pageSize)
}

function renderUsers() {
  const filtered = getFiltered()
  const paged = getPaged()
  const total = filtered.length
  const totalPages = getTotalPages()

  const countText = '当前共 ' + state.allUsers.length + ' 个授权用户名' +
    (state.search ? '（匹配 ' + total + ' 个）' : '')
  $('countLine').textContent = countText

  const box = $('listBox')
  box.innerHTML = ''

  if (!total) {
    box.innerHTML = '<div class="empty">' +
      (state.search ? '没有找到匹配的用户名' : '名单还是空的～先把你自己的用户名加进去吧') +
      '</div>'
    renderPagination(totalPages)
    updateBatchBar()
    return
  }

  // 列表头：全选（本页）
  const header = document.createElement('div')
  header.className = 'list-header'
  const selectAllCb = document.createElement('input')
  selectAllCb.type = 'checkbox'
  selectAllCb.id = 'selectAll'
  const allOnPageSelected = paged.length > 0 && paged.every((u) => state.selected.has(u))
  const someOnPageSelected = paged.some((u) => state.selected.has(u))
  selectAllCb.checked = allOnPageSelected
  selectAllCb.indeterminate = !allOnPageSelected && someOnPageSelected
  selectAllCb.addEventListener('change', () => {
    if (selectAllCb.checked) {
      paged.forEach((u) => state.selected.add(u))
    } else {
      paged.forEach((u) => state.selected.delete(u))
    }
    renderUsers()
  })
  const saLabel = document.createElement('label')
  saLabel.htmlFor = 'selectAll'
  saLabel.textContent = '全选（本页）'
  header.appendChild(selectAllCb)
  header.appendChild(saLabel)
  box.appendChild(header)

  const ul = document.createElement('ul')
  ul.className = 'list'
  paged.forEach((name) => {
    const li = document.createElement('li')
    const cb = document.createElement('input')
    cb.type = 'checkbox'
    cb.checked = state.selected.has(name)
    cb.addEventListener('change', () => {
      if (cb.checked) state.selected.add(name)
      else state.selected.delete(name)
      renderUsers()
    })
    const span = document.createElement('span')
    span.className = 'uname'
    span.textContent = name
    const btn = document.createElement('button')
    btn.className = 'btn-del'
    btn.textContent = '删除'
    btn.addEventListener('click', () => removeUser(name))
    li.appendChild(cb)
    li.appendChild(span)
    li.appendChild(btn)
    ul.appendChild(li)
  })
  box.appendChild(ul)

  renderPagination(totalPages)
  updateBatchBar()
}

function renderPagination(totalPages) {
  const filtered = getFiltered()
  const total = filtered.length
  $('pageInfo').textContent = total
    ? '第 ' + state.page + ' / ' + totalPages + ' 页（共 ' + total + ' 条）'
    : ''
  $('prevBtn').disabled = state.page <= 1
  $('nextBtn').disabled = state.page >= totalPages
}

function updateBatchBar() {
  const n = state.selected.size
  const bar = $('batchBar')
  if (n > 0) {
    bar.classList.remove('hidden')
    $('batchInfo').textContent = '已选 ' + n + ' 个用户名'
  } else {
    bar.classList.add('hidden')
  }
}

async function loadUsers() {
  const r = await api('/admin-api/users')
  if (!r.ok) {
    if (r.status === 401) {
      panelBox.classList.add('hidden')
      loginBox.classList.remove('hidden')
      flash(loginMsg, '登录已过期，请重新输入密码', 'err')
    } else {
      flash(panelMsg, r.data.message || '加载名单失败', 'err')
    }
    return
  }
  state.allUsers = r.data.users || []
  renderUsers()
}

async function addUser() {
  const input = $('newName')
  const name = input.value.trim()
  if (!name) return flash(panelMsg, '请输入用户名', 'err')
  $('addBtn').disabled = true
  const r = await api('/admin-api/users', { method: 'POST', body: JSON.stringify({ name }) })
  $('addBtn').disabled = false
  if (r.ok) {
    input.value = ''
    state.allUsers = r.data.users || []
    state.page = 1
    renderUsers()
    flash(panelMsg, '已添加：' + name, 'ok')
  } else {
    flash(panelMsg, r.data.message || '添加失败', 'err')
  }
}
$('addBtn').addEventListener('click', addUser)
$('newName').addEventListener('keydown', (e) => { if (e.key === 'Enter') addUser() })

async function removeUser(name) {
  if (!confirm('确定把「' + name + '」从名单中删除吗？\n删除后该用户会立即失去访问权限。')) return
  const r = await api('/admin-api/users', { method: 'DELETE', body: JSON.stringify({ name }) })
  if (r.ok) {
    state.allUsers = r.data.users || []
    state.selected.delete(name)
    renderUsers()
    flash(panelMsg, '已删除：' + name, 'ok')
  } else {
    flash(panelMsg, r.data.message || '删除失败', 'err')
  }
}

async function removeSelected() {
  const names = [...state.selected]
  if (!names.length) return
  if (!confirm('确定删除选中的 ' + names.length + ' 个用户名吗？\n删除后这些用户会立即失去访问权限。')) return
  $('batchDelBtn').disabled = true
  const r = await api('/admin-api/users', { method: 'DELETE', body: JSON.stringify({ names }) })
  $('batchDelBtn').disabled = false
  if (r.ok) {
    state.allUsers = r.data.users || []
    state.selected.clear()
    renderUsers()
    flash(panelMsg, '已删除 ' + names.length + ' 个用户名', 'ok')
  } else {
    flash(panelMsg, r.data.message || '批量删除失败', 'err')
  }
}

// ---------- 搜索 / 翻页 事件 ----------
$('searchInput').addEventListener('input', (e) => {
  state.search = e.target.value
  state.page = 1
  renderUsers()
})

$('pageSizeSelect').addEventListener('change', (e) => {
  state.pageSize = parseInt(e.target.value, 10) || 20
  state.page = 1
  renderUsers()
})

$('prevBtn').addEventListener('click', () => {
  if (state.page > 1) { state.page--; renderUsers() }
})
$('nextBtn').addEventListener('click', () => {
  if (state.page < getTotalPages()) { state.page++; renderUsers() }
})

$('clearSelBtn').addEventListener('click', () => {
  state.selected.clear()
  renderUsers()
})
$('batchDelBtn').addEventListener('click', removeSelected)

// ---------- 退出 ----------
$('logoutBtn').addEventListener('click', async () => {
  await api('/admin-api/logout', { method: 'POST' })
  panelBox.classList.add('hidden')
  loginBox.classList.remove('hidden')
  $('pw').value = ''
})

// 启动时若已有管理员 Cookie，直接进入
;(async function init() {
  const r = await api('/admin-api/me')
  if (r.ok) {
    loginBox.classList.add('hidden')
    panelBox.classList.remove('hidden')
    loadUsers()
  } else {
    $('pw').focus()
  }
})()
</script>
</body>
</html>
